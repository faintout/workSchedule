<script>
(() => {
  const root = document.getElementById("schedule-preview");
  const find = id => root.querySelector("#" + id);
  const OVERTIME_AVATAR_SCOPE = "self"; // Change to "all" if all members need orange overtime avatars.
  const users = [{id:0,name:"王小明"},{id:1,name:"李晓丽"},{id:2,name:"陈晨"},{id:3,name:"刘芳"},{id:4,name:"Alexandria"},{id:5,name:"周雨晴"},{id:6,name:"赵子轩"},{id:7,name:"孙悦"},{id:8,name:"郑浩"},{id:9,name:"吴思语"}];
  const colors = ["#526B8A","#587663","#4E7178","#736481","#875F73","#456C66","#535B79","#68744F","#7C654A","#424D5D"];
  const overtimeColor = "#B97543";
  const weekdays = ["周日","周一","周二","周三","周四","周五","周六"];
  const seed = {};
  function add(day,user,am,pm,ot=false) {const key="2026-11-"+String(day).padStart(2,"0");(seed[key] ||= []).push({user,am,pm,ot});}
  [[2,0,true,false],[2,1,true,true],[2,2,false,true],[3,1,true,true],[3,3,true,false],[4,0,true,false,true],[4,1,true,true,true],[4,2,true,true],[4,3,false,true],[4,4,true,false],[5,2,true,false],[5,3,false,true],[5,4,false,false,true],[6,0,true,true,true],[6,1,true,true],[6,2,true,false,true],[6,3,false,true,true],[6,4,false,false,true],[7,0,false,false,true],[7,3,false,true],[7,4,false,false,true],[9,0,true,false],[9,2,true,true],[11,1,true,true],[11,4,true,false],[12,0,false,false,true],[12,1,true,true],[12,2,true,true],[12,3,true,true,true],[12,4,true,true],[14,1,false,false,true],[14,4,false,false,true],[16,0,true,true],[16,3,true,true],[18,0,false,true,true],[18,1,true,true],[18,2,true,false],[18,4,true,true],[20,2,false,false,true],[20,3,false,true],[21,0,false,false,true],[23,0,true,false],[23,1,false,true],[23,3,true,true],[25,2,true,false],[25,1,false,true],[25,4,true,true],[26,0,true,true,true],[26,1,true,true],[26,2,true,true],[26,3,true,true],[26,4,true,true],[27,3,false,true],[27,4,true,true],[30,0,true,true],[30,1,true,true],[30,2,false,true]].forEach(a=>add(...a));
  users.forEach(u=>add(10,u.id,u.id===0?false:u.id%3!==1,u.id===0?false:u.id%3!==2,u.id%4===0));
  const state={schema:3,year:2026,month:10,onlyMine:false,limit:3,schedules:seed};
  let selectedDate=null, returnDate=null, editing=false, detailPage=0;
  const slots=e=>Number(e.am)+Number(e.pm)+Number(e.ot);
  const records=date=>(state.schedules[date]||[]).slice().sort((a,b)=>slots(b)-slots(a)||a.user-b.user);
  const visible=date=>records(date).filter(e=>!state.onlyMine||e.user===0);
  const shift=e=>[e.am&&e.pm?"全天":e.am?"上午":e.pm?"下午":"",e.ot?"加班":""].filter(Boolean).join(" · ");
  const dot=id=>'<i class="sp-dot" style="--sp-user-color:'+colors[id%colors.length]+'" aria-hidden="true"></i>';
  function textColor(hex){const c=hex.slice(1).match(/.{2}/g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return c[0]*.2126+c[1]*.7152+c[2]*.0722>.179?"#141414":"#FFFFFF";}
  function restore(value){const p=value?.privateContent;if(!p||![2,3].includes(p.schema))return;if(Number.isInteger(p.year)&&p.year>=1900&&p.year<=2100)state.year=p.year;if(Number.isInteger(p.month)&&p.month>=0&&p.month<=11)state.month=p.month;if(typeof p.onlyMine==="boolean")state.onlyMine=p.onlyMine;if(Number.isInteger(p.limit)&&p.limit>=2&&p.limit<=3)state.limit=p.limit;if(p.schedules&&typeof p.schedules==="object"){const valid={};Object.entries(p.schedules).forEach(([d,list])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Array.isArray(list))valid[d]=list.filter(e=>Number.isInteger(e.user)&&users[e.user]&&["am","pm","ot"].every(k=>typeof e[k]==="boolean")&&slots(e)>0).slice(0,users.length)});state.schedules=valid}}
  function remember(){if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{month:state.year+"-"+String(state.month+1).padStart(2,"0"),onlyMine:state.onlyMine,currentUser:"王小明",visiblePeopleLimit:state.limit,selectedDate},privateContent:{...state}})).catch(()=>{})}
  function renderCalendar(){
    state.limit=Math.max(2,Math.min(3,Math.round(state.limit)));find("sp-year").textContent=state.year+" 年";find("sp-month").textContent=(state.month+1)+" 月";find("sp-mine").checked=state.onlyMine;
    find("sp-users").innerHTML=users.map(u=>'<span class="sp-user-label">'+dot(u.id)+u.name+(u.id===0?'<span class="sp-me-label">我</span>':'')+'</span>').join("");
    const start=(new Date(Date.UTC(state.year,state.month,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(state.year,state.month+1,0)).getUTCDate(),weeks=Math.ceil((start+days)/7);let html="";
    find("sp-calendar").style.gridTemplateRows="repeat("+weeks+",minmax(0,1fr))";
    for(let i=0;i<weeks*7;i++){const day=i-start+1;if(day<1||day>days){html+='<span class="sp-empty" aria-hidden="true"></span>';continue}const date=state.year+"-"+String(state.month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0"),entries=visible(date),own=records(date).find(e=>e.user===0),weekend=i%7>=5;
      html+='<button type="button" data-date="'+date+'" class="sp-day cursor-interaction'+(weekend?' is-weekend':'')+(own?' has-mine':'')+(own?.ot?' has-mine-ot':'')+(selectedDate===date?' is-selected':'')+'" aria-label="'+(state.month+1)+'月'+day+'日，'+(entries.length?entries.map(e=>users[e.user].name+" "+shift(e)).join("，"):"暂无排班")+'" aria-expanded="'+(selectedDate===date)+'" aria-haspopup="dialog"><span class="sp-number-row"><span class="sp-number'+(date==="2026-11-02"?' sp-today':'')+'">'+day+'</span><span class="sp-date-markers">'+(own?.ot?'<span class="sp-own-ot">加</span>':'')+(weekend?'<span class="sp-rest">休</span>':'')+'</span></span><span class="sp-avatars"></span></button>';
    }
    find("sp-calendar").innerHTML=html;find("sp-calendar").setAttribute("aria-label",state.year+"年"+(state.month+1)+"月");fitCalendar();
  }
  const countMeasure=document.createElement("canvas").getContext("2d");
  function fitCalendar(){
    const days=Array.from(root.querySelectorAll(".sp-day")),app=root.querySelector(".sp-app"),calendar=find("sp-calendar");
    if(!days.length)return;
    const weeks=Math.ceil(calendar.children.length/7),chrome=app.clientHeight-calendar.clientHeight;
    const minimumDay=Math.max(...days.map(day=>{const row=day.querySelector(".sp-number-row"),font=parseFloat(getComputedStyle(row).fontSize);return row.getBoundingClientRect().height+Math.max(16,Math.ceil(font+4))+13}));
    app.style.minHeight=Math.max(552,Math.ceil(chrome+weeks*minimumDay+2))+"px";
    days.forEach(day=>{
      const area=day.querySelector(".sp-avatars"),entries=visible(day.dataset.date),style=getComputedStyle(day.querySelector(".sp-number-row")),font=parseFloat(style.fontSize),size=Math.max(16,Math.ceil(font+4)),r=area.getBoundingClientRect();
      countMeasure.font=style.fontWeight+" "+style.fontSize+" "+style.fontFamily;
      const countWidth=Math.ceil(Math.max(0,...entries.map((_,i)=>countMeasure.measureText("+"+(i+1)).width)))+2,cols=r.width-2>=size*2+2?2:r.width-2>=size?1:0,rows=Math.max(0,Math.min(2,Math.floor((r.height-2+2)/(size+2)))),capacity=cols*rows;
      let shown=Math.min(entries.length,state.limit,capacity),counterSpan=0;
      if(entries.length>shown){const columnWidth=(r.width-2-Math.max(cols-1,0)*2)/Math.max(cols,1);counterSpan=cols===2&&countWidth>columnWidth?2:1;while(shown>0&&shown+counterSpan>capacity)shown--;}
      area.style.setProperty("--sp-avatar-size",size+"px");area.style.gridTemplateColumns="repeat("+Math.max(cols,1)+",minmax(0,1fr))";area.style.gridTemplateRows=rows?"repeat("+rows+","+size+"px)":"auto";
      area.innerHTML=entries.slice(0,shown).map(e=>{const color=e.ot&&(OVERTIME_AVATAR_SCOPE==="all"||e.user===0)?overtimeColor:colors[e.user%colors.length];return '<span class="sp-avatar'+(e.user===0?' is-me':'')+'" style="--sp-avatar-color:'+color+';--sp-avatar-text:'+textColor(color)+'">'+users[e.user].name.slice(-1)+'</span>'}).join("")+(entries.length>shown?'<span class="sp-extra" style="grid-column:span '+counterSpan+'">+'+(entries.length-shown)+'</span>':'');
    });
  }
  function block(e,start,end){
    const rows=[120,120,60],normalHeight=rows.slice(start,Math.min(end+1,2)).reduce((a,b)=>a+b,0),height=rows.slice(start,end+1).reduce((a,b)=>a+b,0),hasOT=end===2,identity=colors[e.user%colors.length],fill=hasOT&&normalHeight?'linear-gradient(to bottom,'+identity+' 0 '+(normalHeight/height*100)+'%,'+overtimeColor+' '+(normalHeight/height*100)+'% 100%)':hasOT?overtimeColor:identity,tag=e.user===0?"button":"div";
    return '<'+tag+(tag==="button"?' type="button" data-edit-user="0"':'')+' class="sp-block'+(e.user===0?' is-me cursor-interaction':'')+(!normalHeight?' is-ot-only':'')+'" style="grid-row:'+(start+2)+' / '+(end+3)+';--sp-user-color:'+identity+';--sp-block-fill:'+fill+';--sp-block-text:'+textColor(normalHeight?identity:overtimeColor)+';--sp-name-height:'+(normalHeight||height)+'px" aria-label="'+users[e.user].name+"，"+shift(e)+(e.user===0?"，编辑我的排班":"，只读")+'"><i class="sp-block-identity" aria-hidden="true"></i><span class="sp-block-label"><span class="sp-block-name">'+users[e.user].name+'</span></span></'+tag+'>';
  }
  function renderDetail(locateOwn=false){
    if(!selectedDate)return;const parts=selectedDate.split("-").map(Number),entries=visible(selectedDate);
    find("sp-date").textContent=parts[0]+"年"+parts[1]+"月"+parts[2]+"日";find("sp-count").textContent=weekdays[new Date(Date.UTC(parts[0],parts[1]-1,parts[2])).getUTCDay()]+" · "+(state.onlyMine?"仅我的排班":"")+entries.length+" 人排班";
    const width=find("sp-matrix-scroll").getBoundingClientRect().width||root.querySelector(".sp-app").clientWidth-56,capacity=entries.length<=5?Math.max(entries.length,1):Math.max(4,Math.min(6,Math.floor((width+3)/43))),pages=Math.max(1,Math.ceil(entries.length/capacity));if(locateOwn){const ownIndex=entries.findIndex(e=>e.user===0);detailPage=ownIndex>=0?Math.floor(ownIndex/capacity):0}detailPage=Math.max(0,Math.min(pages-1,detailPage));const shown=entries.slice(detailPage*capacity,(detailPage+1)*capacity);
    find("sp-people").style.setProperty("--sp-count",String(Math.max(shown.length,1)));
    find("sp-people").innerHTML=shown.length?shown.map(e=>{let html='<article class="sp-person-column'+(e.user===0?' is-me':'')+'" data-user="'+e.user+'" aria-label="'+users[e.user].name+'"><div class="sp-column-header">'+(e.user===0?'我':'')+'</div>';for(let row=0;row<3;row++)html+='<span class="sp-lane" style="grid-row:'+(row+2)+'" aria-hidden="true"></span>';const chosen=[e.am,e.pm,e.ot];for(let row=0;row<3;row++){if(!chosen[row])continue;let end=row;while(end+1<3&&chosen[end+1])end++;html+=block(e,row,end);row=end;}return html+'</article>'}).join(""):'<div class="sp-empty-detail">当天暂无排班</div>';
    find("sp-pagination").hidden=pages<=1||editing;find("sp-page-number").textContent=(detailPage+1)+" / "+pages;find("sp-page-prev").disabled=detailPage===0;find("sp-page-next").disabled=detailPage===pages-1;
    find("sp-edit").textContent=records(selectedDate).some(e=>e.user===0)?"编辑我的排班":"添加我的排班";
    find("sp-form").hidden=!editing;find("sp-detail-actions").hidden=editing;
  }
  function render(){renderCalendar();if(selectedDate)renderDetail()}
  function openDate(date){selectedDate=date;returnDate=date;editing=false;detailPage=0;find("sp-status").textContent="";find("sp-overlay").hidden=false;find("sp-main").inert=true;render();renderDetail(true);find("sp-close").focus();remember()}
  function closeDate(){const previous=returnDate;selectedDate=null;editing=false;find("sp-overlay").hidden=true;find("sp-main").inert=false;renderCalendar();if(previous)root.querySelector('[data-date="'+previous+'"]')?.focus();remember()}
  function updateSaveAction(){const chosen=["am","pm","ot"].some(k=>find("sp-"+k).checked),existing=records(selectedDate).some(e=>e.user===0);find("sp-save").textContent=existing&&!chosen?"确认删除":"保存";find("sp-save").disabled=!existing&&!chosen}
  function editOwn(){if(!selectedDate)return;const own=records(selectedDate).find(e=>e.user===0);["am","pm","ot"].forEach(k=>find("sp-"+k).checked=!!own?.[k]);find("sp-delete").hidden=!own;find("sp-status").textContent="";editing=true;renderDetail(true);updateSaveAction();find("sp-am").focus()}
  function saveOwn(remove=false){if(!selectedDate)return;const entry={user:0,am:find("sp-am").checked,pm:find("sp-pm").checked,ot:find("sp-ot").checked};if(!remove&&!slots(entry)&&!records(selectedDate).some(e=>e.user===0))return;state.schedules[selectedDate]=records(selectedDate).filter(e=>e.user!==0);if(!remove&&slots(entry))state.schedules[selectedDate].push(entry);editing=false;find("sp-status").textContent=remove||!slots(entry)?"已删除我的排班":"已保存我的排班";render();renderDetail(true);find("sp-edit").focus();remember()}
  restore(window.openai?.widgetState);renderCalendar();
  find("sp-mine").addEventListener("change",e=>{state.onlyMine=e.target.checked;render();remember()});
  find("sp-calendar").addEventListener("click",e=>{const button=e.target.closest("button[data-date]");if(button)openDate(button.dataset.date)});
  find("sp-close").addEventListener("click",closeDate);
  find("sp-overlay").addEventListener("click",e=>{if(e.target===find("sp-overlay"))closeDate()});
  find("sp-people").addEventListener("click",e=>{if(e.target.closest("button[data-edit-user]"))editOwn()});
  find("sp-edit").addEventListener("click",editOwn);
  find("sp-page-prev").addEventListener("click",()=>{detailPage--;renderDetail()});find("sp-page-next").addEventListener("click",()=>{detailPage++;renderDetail()});
  ["am","pm","ot"].forEach(k=>find("sp-"+k).addEventListener("change",updateSaveAction));
  find("sp-cancel").addEventListener("click",()=>{editing=false;renderDetail();find("sp-edit").focus()});
  find("sp-form").addEventListener("submit",e=>{e.preventDefault();saveOwn()});
  find("sp-delete").addEventListener("click",()=>saveOwn(true));
  function moveMonth(amount){const date=new Date(Date.UTC(state.year,state.month+amount,1));state.year=date.getUTCFullYear();state.month=date.getUTCMonth();renderCalendar();remember()}
  find("sp-prev").addEventListener("click",()=>moveMonth(-1));find("sp-next").addEventListener("click",()=>moveMonth(1));
  root.addEventListener("keydown",e=>{if(find("sp-overlay").hidden)return;if(e.key==="Escape"){e.preventDefault();closeDate()}else if(e.key==="Tab"){const targets=Array.from(find("sp-dialog").querySelectorAll('button:not([disabled]),input:not([disabled])')).filter(el=>el.getClientRects().length),first=targets[0],last=targets[targets.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
  const resizeObserver=new ResizeObserver(()=>{fitCalendar();if(selectedDate)renderDetail()});resizeObserver.observe(root.querySelector(".sp-app"));
})();
</script>
