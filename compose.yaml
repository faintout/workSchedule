services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      TZ: Asia/Shanghai
      DATABASE_PATH: /app/data/schedule.sqlite
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 设置至少六位管理员密码}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - schedule-data:/app/data
    restart: unless-stopped
volumes:
  schedule-data:
